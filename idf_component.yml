## IDF Component Manager Manifest File
version: "0.1.5"
description: "A light layer of widgets on the DGX display library for ESP32: rows and columns, values that come as messages from other tasks, animation only while a widget asks for time"
url: https://github.com/jef-sure/esp32-component-dgx-ui
repository: https://github.com/jef-sure/esp32-component-dgx-ui.git
documentation: https://github.com/jef-sure/esp32-component-dgx-ui/blob/main/README.md
issues: https://github.com/jef-sure/esp32-component-dgx-ui/issues

dependencies:
  idf:
    version: ">=5.2.0"
  jef-sure/dgx:
    version: "^0.12.11" # 0.11.3: the clip of a screen; 0.11.4: a text set in a field, an opaque 1-bit picture;
                        # 0.11.6: the hard pen the same in a screen moved by whole pixels; 0.11.8: two soft letters
                        # meeting in a cell of a 16-bit display behind a bus give it the later letter's level;
                        # 0.12: a font a constant, so that a style may be one in flash; 0.12.1: the glyphs by offsets,
                        # a font as a file of bytes; 0.12.3: the colours' names of CSS with CSS's values; 0.12.10:
                        # pictures as files of bytes (.dgxi), embedded by the build, which pictures of files take;
                        # 0.12.11: masks and the opacity of pictures of 16 bits, which soft pictures draw

tags:
  - user-interface
  - gui
  - widgets
  - display
  - dgx
  - esp32

maintainers:
  - "Anton Petrusevich <anton.petrusevich.mobile@gmail.com>"

license: MIT

files:
  # A list of what goes into the archive, and nothing else does, as DGX has it: the manager starts from every file in
  # the directory, takes away what "exclude" says and adds back what "include" says, so "include" limits nothing by
  # itself. A file of a new kind (the tests, the examples, the plans, an editor's index) stays out until it is listed
  # here.
  exclude:
    - "**/*"
  include:
    - "idf_component.yml"
    - "CMakeLists.txt"
    - "project_include.cmake"  # dgx_ui_tree() and dgx_ui_names(): descriptions made C at build time
    - "Kconfig"  # CONFIG_DGX_UI_HATCH: the hatched fill of a screen of 1 bit
    - "host/**/*.mk"  # dgx-ui built on the computer with make, beside DGX's host/dgx_host.mk
    - "src/**/*.c"
    - "src/**/*.h"
    - "include/**/*.h"
    # dgx_ui_c, built on the computer by the rule of project_include.cmake
    - "tools/dgx_ui_c.c"
    - "tools/dgx_ui_names.c"
    - "tools/dgx_ui_names.h"
    - "tools/dgx_ui_c.py"
    - "tools/README.md"
    - "tools/Makefile"  # dgx_ui_c built by make, as tools/README.md shows
    # the builder served from a terminal, for a browser that gives a page no folder to open
    - "tools/dgx_ui_serve.py"
    - "tools/dgx_ui_mcp.py"
    - "tools/skills/dgx-ui-builder/SKILL.md"  # the skill dgx_ui_mcp.py --install copies for Claude Code
    # the builder of pages: its page, opened from the disk, its parts, and Vue and Pinia with their licences
    - "editor/README.md"
    - "editor/index.html"
    - "editor/start.js"
    - "editor/builder.css"
    - "editor/app.js"
    - "editor/store.js"
    - "editor/host_browser.js"
    - "editor/host_server.js"
    - "editor/agent.js"
    - "editor/lang.js"
    - "editor/lang/ru.js"
    - "editor/description.js"
    - "editor/appearance.js"
    - "editor/names.js"
    - "editor/history.js"
    - "editor/vendor/README.md"
    - "editor/vendor/vue.global.prod.js"
    - "editor/vendor/pinia.iife.prod.js"
    - "editor/vendor/LICENSE.vue"
    - "editor/vendor/LICENSE.pinia"
    # the preview of a description built to WebAssembly: the file a page loads, the page to try it by hand, what it is
    # made of and how, and the licences of what is in it
    - "editor/preview/README.md"
    - "editor/preview/dgx_ui_preview.js"
    - "editor/preview/index.html"
    - "editor/preview/index.js"
    - "editor/preview/dgx_ui_preview.c"
    - "editor/preview/dgx_ui_preview.h"
    - "editor/preview/preview_class.js"
    - "editor/preview/preview_build.py"
    - "editor/preview/Makefile"
    - "editor/preview/licenses/README.md"
    - "editor/preview/licenses/LICENSE-DGX"
    - "editor/preview/licenses/OFL-1.1.txt"
    - "editor/preview/licenses/DejaVu-LICENSE.txt"
    - "editor/preview/licenses/Apache-2.0.txt"
    - "editor/preview/licenses/FONTS-DGX.md"
    - "editor/preview/licenses/wasi-libc.copyright"
    - "editor/preview/licenses/libclang-rt-21-dev-wasm32.copyright"
    - "editor/preview/licenses/taken.txt"
    # the one example the registry hands out, each of its files named: it takes the component from the registry, as a
    # project made of it does. The other examples take the component by the path of a checkout and stay out
    - "examples/hello/.gitignore"
    - "examples/hello/CMakeLists.txt"
    - "examples/hello/README.md"
    - "examples/hello/sdkconfig.defaults"
    - "examples/hello/sdkconfig.defaults.linux"
    - "examples/hello/main/CMakeLists.txt"
    - "examples/hello/main/idf_component.yml"
    - "examples/hello/main/main.c"
    - "README.md"
    - "README-ru.md"
    - "docs/en/*.md"
    - "docs/ru/*.md"
    - "docs/images/*.png"
    - "CHANGES.md"
    - "LICENSE"
