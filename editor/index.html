<!DOCTYPE html>
<!--
  The builder of dgx-ui's pages, opened from the disk with no server: a project's descriptions drawn by the preview as
  the board draws them, their widgets edited, and the files saved back. Its parts are the scripts below; a page that
  hosts the builder loads the same and calls dgxUiBuilderMount() on an element of its own.
-->
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>dgx-ui builder</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="builder.css">
    <style>body { margin: 0; }</style>
    <script src="vendor/vue.global.prod.js"></script>
    <script src="vendor/pinia.iife.prod.js"></script>
    <script src="preview/dgx_ui_preview.js"></script>
    <script src="description.js"></script>
    <script src="history.js"></script>
    <script src="lang.js"></script>
    <script src="lang/ru.js"></script>
    <script src="host_browser.js"></script>
    <script src="store.js"></script>
    <script src="app.js"></script>
</head>

<body>
    <div id="app"></div>
    <script>
        dgxUiBuilderMount('#app', { host: dgxUiBrowserHost, start: { language: navigator.language.startsWith('ru') ? 'ru' : 'en' } });
    </script>
</body>

</html>
